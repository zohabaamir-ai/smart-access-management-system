<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Smart Access Management System — the SystemLogo shield mark
       (same artwork as src/components/branding/SystemLogo.tsx). -->
  <defs>
    <linearGradient id="samsShield" x1="18" y1="10" x2="82" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" />
      <stop offset="0.55" stop-color="#06B6D4" />
      <stop offset="1" stop-color="#0B78E3" />
    </linearGradient>
  </defs>

  <!-- Outer shield -->
  <path d="M50 5L88 19V47C88 69 73 87 50 96C27 87 12 69 12 47V19L50 5Z" fill="url(#samsShield)" />

  <!-- Inner shield -->
  <path d="M50 14L79 25V47C79 64 67 78 50 86C33 78 21 64 21 47V25L50 14Z" fill="#020617" />

  <!-- Person -->
  <circle cx="50" cy="39" r="11" fill="#ffffff" />
  <path d="M31 65C31 54.5 39.5 48 50 48C60.5 48 69 54.5 69 65V68H31V65Z" fill="#ffffff" />

  <!-- Recognition frame -->
  <path d="M30 27V22H36M64 22H70V27M30 51V56H36M64 56H70V51" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" />

  <!-- Lock -->
  <rect x="39" y="62" width="22" height="18" rx="4" fill="#ffffff" />
  <path d="M44 62V57C44 53.7 46.7 51 50 51C53.3 51 56 53.7 56 57V62" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <circle cx="50" cy="70" r="2.2" fill="#020617" />
  <path d="M50 72V76" stroke="#020617" stroke-width="2" stroke-linecap="round" />
</svg>
